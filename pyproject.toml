[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "art-director"
version = "1.0.0"
description = "100% Offline, Cross-Platform Low-Latency Voice Controller for Live Stage Audio/Video Workstations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "python-osc>=1.8.3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7.6",
    "psutil>=5.9.5",
    "websocket-client>=1.6.0",
    "vosk>=0.3.45",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
